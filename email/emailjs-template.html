<!--
  EmailJS template setup for the portfolio contact form.

  WHY THIS FILE CHANGED: earlier versions of this repo asked you to paste a
  full HTML design into the EmailJS dashboard's Content editor. In practice
  that step kept getting missed or pasted into the wrong editor mode, so the
  dashboard kept sending its own default sample content ("Email sent via
  EmailJS.com", blank subject) instead of this design.

  The email body is now generated entirely in code
  (lib/email-template.ts) and sent as a single variable, `email_html`. The
  dashboard template only needs 4 short field values below — nothing to
  paste, no editor-mode switch required.

  ---------------------------------------------------------------------
  REQUIRED DASHBOARD SETUP (do this once)
  ---------------------------------------------------------------------
  1. Go to https://dashboard.emailjs.com/admin/templates and open your
     template.
  2. On the "Content" tab:
       Subject -> {{subject}}
       Content -> {{{email_html}}}
     (Content must use TRIPLE braces — {{{ }}} — not double braces.
     Double braces would escape the HTML and show it as literal text.)
  3. On the "Settings" tab:
       To Email  -> {{to_email}}
       From Name -> Portfolio Contact
       Reply To  -> {{reply_to}}
  4. Click "Save", then click "Test It" and confirm the preview shows a
     rendered dark card design — not EmailJS's own sample text. If the
     preview still shows "Email sent via EmailJS.com", the Content field
     was not saved as {{{email_html}}}.

  All variables sent by the app (components/contact.tsx):
  - subject
  - email_html   (fully rendered HTML body — use with TRIPLE braces)
  - from_email
  - reply_to
  - message      (plain text, available if you want to build your own
                  design directly in the dashboard instead)
  - to_email
  - site_name
  - submitted_at
-->
